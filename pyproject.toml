[project]
name = "mince-brasil"
version = "1.0.0"
description = "Mapeamento dos 27 Minerais Criticos e Estrategicos do Brasil (PNMCE / CIMCE 2026) a partir de dados publicos da ANM/SIGMINE e IBGE (excerto cartografico — snapshot nov/2026)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jonathan Ramos Oliveira", email = "jonathanro-br@live.com" },
]
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.10",
    "pyarrow>=18.0",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "requests>=2.31",
    "urllib3>=2.0",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/jonathanobr/mince_brasil"
Repository = "https://github.com/jonathanobr/mince_brasil"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
